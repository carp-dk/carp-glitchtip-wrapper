name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only keep the latest run per ref; cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Minimum supported toolchain: sentry_flutter 10 requires Flutter 3.44.0
  # (Dart 3.12), so that is the floor the package is tested against.
  FLUTTER_VERSION: "3.44.0"
  # The example app uses material_ui, which requires Flutter 3.47 (Dart 3.13).
  # Analysis walks into example/, so it runs on this version too.
  EXAMPLE_FLUTTER_VERSION: "3.47.8"
  FLUTTER_CHANNEL: "stable"

# Third-party actions are pinned to full commit SHAs (with a version comment) for
# supply-chain safety; the trailing `# vX` keeps Dependabot bumping them cleanly.
jobs:
  analyze:
    name: Format, analyze & publishability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.EXAMPLE_FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install example dependencies
        # `flutter analyze` and `dart format` walk into example/, so it needs
        # its own resolved package config to avoid unresolved-import errors.
        working-directory: example
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Validate package is publishable
        run: dart pub publish --dry-run

  test:
    name: Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "min · Flutter 3.44.0"
            version: "3.44.0"
            channel: stable
          - label: "latest stable"
            version: ""
            channel: stable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # An empty version makes the action resolve the latest of `channel`.
          flutter-version: ${{ matrix.version }}
          channel: ${{ matrix.channel }}
          cache: true
      - name: Install dependencies
        # Not the example's: it needs a newer Flutter than the package floor.
        run: flutter pub get --no-example
      - name: Run tests with coverage
        run: flutter test --no-pub --coverage
      - name: Upload coverage report
        if: matrix.version == '3.44.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  test-example:
    name: Test example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.EXAMPLE_FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Run the example's tests
        working-directory: example
        run: |
          flutter pub get
          flutter test
